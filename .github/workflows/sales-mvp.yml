name: TOP-SENS Sales MVP read-only tests

# Branch-only test signal. Never deploy or run against live Bitrix/Render.
on:
  push:
    branches: [sales-mvp]

permissions:
  contents: read

jobs:
  sales-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Sales uses only Node built-ins; avoid installing the legacy CRM's
      # unused pdf-parse dependency in this isolated security test job.
      - run: npm run test:sales
