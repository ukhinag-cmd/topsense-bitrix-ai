name: TOP-SENS Sales MVP read-only tests

# Branch-only test signal. Never deploy or run against live Bitrix/Render.
# Pin actions to reviewed immutable commits to prevent movable tag retargeting.
on:
  push:
    branches: [sales-mvp]

permissions:
  contents: read

jobs:
  sales-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      # Sales uses only Node built-ins; avoid installing the legacy CRM's
      # unused pdf-parse dependency in this isolated security test job.
      - run: npm run test:sales
